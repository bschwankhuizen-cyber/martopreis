intro: "Château des Milandes, ooit het thuis van Josephine Baker, is een van de mooiste kastelen van de Dordogne. In deze fotoreportage zie je het kasteel, de weelderige tuinen en de roofvogelshow, waarbij uilen, valken en adelaars over de tribune vliegen."
