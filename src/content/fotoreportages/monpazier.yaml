title: "Fotoreportage Monpazier"
description: "Ruim twintig foto's van Monpazier in de Dordogne: de stadspoort, het plein met bogengalerijen, de 13e-eeuwse markthal, terrasjes en de St. Dominicuskerk."
region: dordogne
date: 2023-08-15
location: "Monpazier, Dordogne"
camera: "Samsung Galaxy S22"
cover: panorama-plein-monpazier-ef.jpg
coverAlt: "Panorama van het centrale plein van Monpazier"
intro: "In augustus 2023 bezocht ik Monpazier twee keer. Dit middeleeuwse bastidestadje is zo fotogeniek dat ik bijna op elke hoek mijn telefoon pakte. Hier zie je alle foto's op een rij – van de stadspoort tot het plein met de eeuwenoude markthal."
