coverAlt: "Groene natuur langs de rivier de Dourbie"
intro: "Een zomer in de vallei van de Dourbie: zwemmen in de rivier, kanovaren met uitzicht op het viaduct van Millau, fietsen over het spoor van de Velorail du Larzac en kaas proeven in de grotten van Roquefort. Dit zijn mijn foto's van de camping en de omgeving."
