title: "Fotoreportage: kamperen bij Val de Cantobre en de Dourbie"
description: "Foto's van Camping Val de Cantobre, de rivier de Dourbie, kanovaren, de Velorail du Larzac, de kaasgrotten van Roquefort en het dorp Nant in de Cevennen."
region: cevennen
date: 2023-07-24
location: "Gorges de la Dourbie, Cevennen (Frankrijk)"
