location: "Rivier de Dordogne (Frankrijk)"
cover: dordogne-rivier-panorama-ef.jpg
coverAlt: "Panorama van de rivier de Dordogne"
intro: "De rivier de Dordogne is de levensader van de streek. In de zomer wordt het water tot wel 25 graden warm: ideaal om te zwemmen, te kanoën en te vissen. In deze fotoreportage zie je de rivier, de kano's en de fijne strandjes – en waarom een camping aan de rivier zo'n aanrader is."
